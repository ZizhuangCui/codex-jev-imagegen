name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Decision behavior checks
        run: python -B skills/jev-imagegen/scripts/test_decide.py
      - name: Installation and CLI checks
        run: python -B -m unittest discover -s tests -v
